name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        run: npm run android:debug

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/mers-remote-${{ github.ref_name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mers-remote-apk-${{ github.ref_name }}
          path: dist/*.apk

  windows:
    runs-on: windows-latest
    env:
      CARGO_HTTP_MULTIPLEXING: false
      CARGO_NET_RETRY: 10
      RUSTUP_MAX_RETRIES: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        shell: powershell
        run: |
          git config --global http.version HTTP/1.1
          npm config set fetch-retries 5
          npm config set fetch-retry-maxtimeout 120000
          npm ci

      - name: Add WiX to PATH
        shell: powershell
        run: |
          $wix = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($wix) { echo $wix.FullName | Out-File -Append -FilePath $env:GITHUB_PATH }
          else { choco install wixtoolset -y --no-progress }

      - name: Build MSI
        shell: powershell
        env:
          SIGNING_KEY_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_PASS_RAW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:SIGNING_KEY_RAW) {
            $cleanKey = ($env:SIGNING_KEY_RAW.Trim() -replace '\s+', '')
            $env:TAURI_SIGNING_PRIVATE_KEY = $cleanKey
            $env:TAURI_PRIVATE_KEY = $cleanKey
          }
          if ($env:SIGNING_PASS_RAW) {
            $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = $env:SIGNING_PASS_RAW
            $env:TAURI_KEY_PASSWORD = $env:SIGNING_PASS_RAW
          } else {
            $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = ""
            $env:TAURI_KEY_PASSWORD = ""
          }
          npm run dist:win

      - name: Debug bundle output
        if: always()
        shell: powershell
        run: |
          Write-Host "=== Bundle directory contents ==="
          Get-ChildItem src-tauri/target/release/bundle -Recurse -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Collect artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          
          # Copy all bundle outputs recursively to dist
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi', '.zip', '.sig', '.json' } | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination dist/ -Force
            Write-Host "Copied to dist: $($_.Name)"
          }

          Compress-Archive -Path manifest.json,bridge.js,content.css,content.js,help.html,popup.html,popup.js,icons -DestinationPath "dist/mers-nfc-tauri-extension-${{ github.ref_name }}.zip" -Force
          
          # Ensure latest.json manifest is present in dist
          $tauriLatest = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Filter "latest.json" -File | Select-Object -First 1
          if ($tauriLatest) {
            Copy-Item -Path $tauriLatest.FullName -Destination "dist/latest.json" -Force
            Write-Host "Found Tauri-generated latest.json:"
            Get-Content "dist/latest.json"
          } else {
            # Find the signed updater bundle (.zip or installer) and its .sig
            $sigFile = Get-ChildItem -Path dist -Filter "*.sig" -File | Select-Object -First 1
            $bundleFile = $null
            if ($sigFile) {
              $baseName = $sigFile.Name.Substring(0, $sigFile.Name.Length - 4)
              if (Test-Path "dist/$baseName") {
                $bundleFile = Get-Item "dist/$baseName"
              }
            }
            if (-not $bundleFile) {
              $bundleFile = Get-ChildItem -Path dist -File | Where-Object { $_.Extension -in '.zip', '.exe', '.msi' } | Select-Object -First 1
            }
            
            if ($bundleFile -and $sigFile) {
              $sigContent = (Get-Content -Path $sigFile.FullName -Raw).Trim()
              $tag = "${{ github.ref_name }}"
              $ver = $tag.TrimStart('v')
              $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              $fileName = $bundleFile.Name
              $url = "https://github.com/endrisusanto/MRS-NFC-Manual-Input/releases/download/$tag/$fileName"
              
              $manifest = [PSCustomObject]@{
                version = $ver
                notes = "Release $tag"
                pub_date = $date
                platforms = [PSCustomObject]@{
                  "windows-x86_64" = [PSCustomObject]@{
                    signature = $sigContent
                    url = $url
                  }
                  "windows-x64" = [PSCustomObject]@{
                    signature = $sigContent
                    url = $url
                  }
                }
              }
              $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path "dist/latest.json" -Encoding utf8
              Write-Host "Generated dist/latest.json for Tauri updater targeting $($fileName):"
              Get-Content -Path "dist/latest.json"
            } else {
              Write-Warning "Bundle or SIG not found in dist, latest.json not generated."
            }
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: mers-nfc-windows-${{ github.ref_name }}
          path: dist/*

  publish:
    runs-on: ubuntu-latest
    needs:
      - android
      - windows

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mers-nfc-${{ github.ref_name }}
          path: dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
